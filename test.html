<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试页 - 2026年7月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;padding:40px 16px}
.wrap{max-width:600px;width:100%}
h1{text-align:center;font-size:1.4rem;margin-bottom:24px;color:#38bdf8}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-name{text-align:center;font-size:.75rem;color:#64748b;padding:8px 0}
.day{text-align:center;padding:10px 4px;border-radius:6px;background:#1e293b;font-size:.85rem}
.day.empty{background:transparent}
.day.today{background:#2563eb;color:#fff;font-weight:700}
.tip{text-align:center;margin-top:24px;font-size:.8rem;color:#475569}
</style>
</head>
<body>
<div class="wrap">
  <h1>☀️ 2026年7月</h1>
  <div class="grid">
    <div class="day-name">一</div><div class="day-name">二</div><div class="day-name">三</div>
    <div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div><div class="day-name">日</div>
    <div class="day empty"></div><div class="day empty"></div><div class="day">1</div><div class="day">2</div>
    <div class="day today">3</div><div class="day">4</div><div class="day">5</div>
    <div class="day">6</div><div class="day">7</div><div class="day">8</div><div class="day">9</div>
    <div class="day">10</div><div class="day">11</div><div class="day">12</div>
    <div class="day">13</div><div class="day">14</div><div class="day">15</div><div class="day">16</div>
    <div class="day">17</div><div class="day">18</div><div class="day">19</div>
    <div class="day">20</div><div class="day">21</div><div class="day">22</div><div class="day">23</div>
    <div class="day">24</div><div class="day">25</div><div class="day">26</div>
    <div class="day">27</div><div class="day">28</div><div class="day">29</div><div class="day">30</div>
    <div class="day">31</div><div class="day empty"></div><div class="day empty"></div>
  </div>
  <p class="tip">今天是7月3日 · 测试页</p>
</div>
</body>
</html>
